# Publica la versión web de Beside en GitHub Pages (https://duangomez.github.io/Beside/).
# Es la que se instala en el iPhone desde Safari (Compartir → Agregar a inicio)
# y se actualiza sola con cada cambio que se sube a main.
name: Publicar web

on:
  push:
    branches: [main]
    paths: ['lib/**', 'web/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build web --release --base-href /Beside/
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      # Demo con datos de ejemplo y sin cuenta (para el portafolio): /Beside/demo/
      - run: flutter build web --release --base-href /Beside/demo/ --dart-define=DEMO=true --dart-define=JUNTOS=true -o build/demo
      - run: cp -r build/demo build/web/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
